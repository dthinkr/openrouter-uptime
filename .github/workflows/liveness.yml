name: liveness

# The collectors' failure mode is silence. A crashed cron leaves the data
# thinning rather than gone, and the only alarm until now lived in the daily
# publish job: a 6-hour threshold checked once a day. On 2026-09-01 the
# collector was down for 105 minutes before a person happened to look, and
# the daily alarm would not have fired for it at all.
#
# This asks one question every hour -- how old is the latest poll on main --
# and fails, which is what emails the repository owner, when the answer is
# longer than the collectors could plausibly explain. Healthy cadence is 15
# minutes with a 12-minute floor; the longest gap in a normal day is about
# 30. Sixty minutes is three consecutive missed Railway ticks with all three
# Actions attempts in that hour dropped too.
#
# Deliberately its own workflow. An alarm that shares a job with heavy work
# inherits that work's failures: an OOM in the audit step is how the daily
# alarm went silent for four days.

on:
  schedule:
    # Off the top of the hour; GitHub drops runs at :00 rather than delaying them.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: "Fail if the latest poll is older than this. Pass 0 to prove the check can fail."
        type: string
        default: "60"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Age of latest poll on main
        env:
          MAX_AGE_MINUTES: ${{ inputs.max_age_minutes || '60' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone
          # No checkout: the repository is ~1 GB of archives and this needs one
          # file. raw.githubusercontent.com caches for a few minutes, which the
          # threshold absorbs.
          url = ("https://raw.githubusercontent.com/dthinkr/openrouter-uptime/"
                 "main/status/latest.json")
          limit = float(os.environ["MAX_AGE_MINUTES"])
          with urllib.request.urlopen(url, timeout=30) as r:
              generated = json.load(r)["generated"]
          ts = datetime.fromisoformat(generated)
          age = (datetime.now(timezone.utc) - ts).total_seconds() / 60
          print(f"latest poll {generated}, {age:.1f} min ago (limit {limit:g} min)")
          if age > limit:
              sys.exit(f"::error::collector is silent: latest poll is {age:.0f} min "
                       f"old, limit {limit:g}. Check the Railway service "
                       f"openrouter-uptime-collector and the poll workflow.")
          PY
